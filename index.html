<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Termékkatalógus - GAOX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #ffffff;
      color: #111;
    }
    .top-bar {
      background-color: #0d0d0d;
      color: #ffffff;
      text-align: center;
      padding: 10px 15px;
      font-weight: 800;
      font-size: 0.85rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .header {
      border-bottom: 1px solid #eaeaea;
      padding: 15px 0;
    }
    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }
    .search-box input {
      padding: 8px 12px 8px 32px;
      border: 1px solid #ccc;
      border-radius: 20px;
      outline: none;
      font-size: 0.9rem;
    }
    .search-icon {
      position: absolute;
      left: 10px;
      width: 16px;
      height: 16px;
      fill: #666;
    }
.logo {
  display: flex;
  align-items: center;
  justify-content: center;
}
   
    .logo img {
      display: block;
      width: 30px;
      height: 30px;
      object-fit: contain;
    }
    .header-icons {
      display: flex;
      gap: 15px;
      align-items: center;
    }
    .header-icons svg {
      width: 22px;
      height: 22px;
      cursor: pointer;
      fill: #333;
    }
    .nav {
      display: flex;
      justify-content: center;
      gap: 25px;
      padding: 15px 0;
      border-bottom: 1px solid #eaeaea;
    }
    .nav a {
      text-decoration: none;
      color: #333;
      font-weight: 800;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .nav a.active {
      text-decoration: underline;
      text-underline-offset: 6px;
      text-decoration-thickness: 2px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 30px;
      margin-bottom: 50px;
    }
    .product-card {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    .image-wrapper {
      width: 100%;
      height: 280px;
      background-color: #f9f9f9;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 15px;
    }
    .image-wrapper img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transition: transform 0.3s ease;
    }
    .product-card:hover .image-wrapper img {
      transform: scale(1.05);
    }
    .product-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: #618137;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .product-price {
      font-size: 0.95rem;
      font-weight: 800;
      color: #618137;
    }
    .section-title {
      font-size: 2.2rem;
      font-weight: 900;
      margin-bottom: 25px;
    }
    .categories-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }
    .category-card {
      height: 180px;
      border-radius: 12px;
      background-size: cover;
      background-position: center;
      position: relative;
      cursor: pointer;
      overflow: hidden;
    }
    .category-card::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.25);
    }
    .category-title {
      position: absolute;
      bottom: 20px;
      left: 20px;
      color: #fff;
      font-size: 1.5rem;
      font-weight: 800;
      z-index: 1;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    AZ OLDAL JELENLEG KARBANTARTÁS ALATT VAN!
  </div>
<div class="logo">
  <img
    src="https://raw.githubusercontent.com/jszatmari15-web/gaoxmain/545d3d64227297b2332e4c4d6814b9d4e889c93a/output-smallpngtools%20(1).png"
    alt="GAOX logo"
  >
</div>
  <header class="header">
    <div class="header-container">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="text" id="searchInput" placeholder="Keresés..." onkeyup="filterProducts()">
      </div>

      <div class="logo">
        <img src="https://raw.githubusercontent.com/jszatmari15-web/gaoxmain/545d3d64227297b2332e4c4d6814b9d4e889c93a/output-smallpngtools%20(1).png" alt="GAOX logo">
      </div>

      <div class="header-icons">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M18 6h-2.58C15.09 3.69 13.68 2 12 2S8.91 3.69 8.58 6H6c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-6-2c1.03 0 1.9.82 2.15 2H9.85c.25-1.18 1.12-2 2.15-2zm6 16H6V8h12v12zm-6-2c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
      </div>
    </div>
  </header>

  <nav class="nav">
    <a href="#" class="active" onclick="filterCategory('all')">Kezdőlap</a>
    <a href="#" onclick="filterCategory('Zászló')">Zászlók</a>
    <a href="#" onclick="filterCategory('Térkép')">Térképek</a>
    <a href="#" onclick="filterCategory('Földgömb')">Földgömbök</a>
  </nav>

  <main class="container">
    <div id="productGrid" class="product-grid">
      <div class="product-card" data-title="Magyar zászló 14x21 cm" data-category="Zászló">
        <div class="image-wrapper">
          <img src="https://raw.githubusercontent.com/jszatmari15-web/gaoxmain/a00f1c585de0a3da9ec903d1936c81acfd3b0a48/Gemini_Generated_Image_77x6u377x6u377x6.png" alt="Magyar zászló">
        </div>
         <a href="product.html" class="product-link">
        <div class="product-title">Magyar zászló 14x21 cm</div>
        <div class="product-price">600 Ft</div>
           </a>
      </div>

      <div class="product-card" data-title="360° Földgömb (kék)" data-category="Földgömb">
        <div class="image-wrapper">
          <img src="https://raw.githubusercontent.com/jszatmari15-web/gaoxmain/a00f1c585de0a3da9ec903d1936c81acfd3b0a48/15292286_27030_Magic_360__Globe_Blue%20(1).jpg" alt="360° Földgömb (kék)">
        </div>
         <a href="360kek.html" class="product-link">
        <div class="product-title">360° Földgömb (kék)</div>
        <div class="product-price">5.000 Ft</div>
         </a>
      </div>

      <div class="product-card" data-title="360° Földgömb (fekete)" data-category="Földgömb">
        <div class="image-wrapper">
          <img src="https://github.com/jszatmari15-web/gaoxmain/blob/main/15292250_26803_Magic_360__Globe_Black.jpg?raw=true" alt="360° Földgömb (fekete)">
        </div>
         <a href="360fekete.html" class="product-link">
        <div class="product-title">360° Földgömb (fekete)</div>
        <div class="product-price">5.000 Ft</div>
           </a>
      </div>

      <div class="product-card" data-title="Antik stílusú földgömb" data-category="Földgömb">
        <div class="image-wrapper">
          <img src="https://raw.githubusercontent.com/jszatmari15-web/gaoxmain/a00f1c585de0a3da9ec903d1936c81acfd3b0a48/15292262_26892A_Antique_Globe_Globe_Brown.jpg" alt="Antik stílusú földgömb">
        </div>
         <a href="antikfoldgomb.html" class="product-link">
        <div class="product-title">Antik stílusú földgömb</div>
        <div class="product-price">12.000 Ft</div>
      </div>
      </a>
    </div>

    <h2 class="section-title">Kategóriák</h2>
    <div class="categories-grid">
      <div class="category-card" style="background-image: url('https://raw.githubusercontent.com/jszatmari15-web/gaoxmain/a00f1c585de0a3da9ec903d1936c81acfd3b0a48/Gemini_Generated_Image_77x6u377x6u377x6.png');">
        <div class="category-title">Zászlók</div>
      </div>
      <div class="category-card" style="background-image: url('https://raw.githubusercontent.com/jszatmari15-web/gaoxmain/a00f1c585de0a3da9ec903d1936c81acfd3b0a48/15292286_27030_Magic_360__Globe_Blue%20(1).jpg');">
        <div class="category-title">Földgömbök</div>
      </div>
    </div>
  </main>

  <script>
    function filterProducts() {
      const input = document.getElementById('searchInput').value.toLowerCase();
      const products = document.querySelectorAll('.product-card');

      products.forEach(product => {
        const title = product.getAttribute('data-title').toLowerCase();
        if (title.includes(input)) {
          product.style.display = "flex";
        } else {
          product.style.display = "none";
        }
      });
    }

    function filterCategory(cat) {
      const products = document.querySelectorAll('.product-card');
      const navLinks = document.querySelectorAll('.nav a');

      navLinks.forEach(link => link.classList.remove('active'));
      event.target.classList.add('active');

      products.forEach(product => {
        const category = product.getAttribute('data-category');
        if (cat === 'all' || category === cat) {
          product.style.display = "flex";
        } else {
          product.style.display = "none";
        }
      });
    }
  </script>
</body>
</html>
