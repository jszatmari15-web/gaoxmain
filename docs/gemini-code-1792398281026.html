<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Termékkatalógus</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="container">
      <h1>Termékkatalógus</h1>
      <div class="controls">
        <input type="text" id="searchInput" placeholder="Keresés termékek között..." onkeyup="filterProducts()">
        <select id="categoryFilter" onchange="filterProducts()">
          <option value="all">Összes kategória</option>
          <option value="Térképek">Térképek</option>
          <option value="Glóbuszok">Glóbuszok</option>
          <option value="Kiegészítők">Kiegészítők</option>
        </select>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="productGrid" class="product-grid">
      <!-- A JavaScript dinamikusan ide tölti be a termékeket -->
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
